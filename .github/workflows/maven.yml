name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check



  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout branch
      uses: actions/checkout@v6

      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: 25
        distribution: temurin
        cache: maven

    - name: Build with Maven
      run: mvn -B -DskipTests package --file pom.xml

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maven-target
        path: target/


  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn test -Dgroups="unit-tests"


  slice-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run Slice Tests
        run: mvn test -Dgroups="slice-tests"


  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run Integration Tests
        run: mvn test -Dgroups="integration-tests"