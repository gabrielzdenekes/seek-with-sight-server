spring:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

  flyway:
    enabled: false

server:
  port: 8443
  ssl:
    enabled: true
    key-store: "classpath:keystore.p12"
    key-store-password: "password"
    key-store-type: PKCS12
    key-alias: "keystoreDev"

logging:
  level:
    root: INFO
    com.seek_with_sight: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  base-url: "https://localhost:8443"

  errors:
    include-stacktrace: true

  storage:
    root-dir: uploads
    public-base-url: ${app.base-url}/${app.storage.root-dir}

  security:
    cors:
      allowed-origins:
        - 'http://localhost:5173'
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
      allow-credentials: true

stripe:
  api:
    key: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}