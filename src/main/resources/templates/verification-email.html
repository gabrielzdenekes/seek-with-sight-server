<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .content {
            padding: 40px;
            color: #333;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #4f46e5;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }

        .footer {
            padding: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        @media(max-width: 600px) {
            .content {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Verify Your Email</h1>
        <p>Welcome to Our Platform</p>
    </div>

    <div class="content">

        <h2>Hello <span th:text="${name}"></span>,</h2>

        <p>
            Thank you for registering. Please verify your email address
            by clicking the button below.
        </p>

        <a class="button"
           th:href="${verificationUrl}">
            Verify Email
        </a>

        <p style="margin-top:30px;">
            If you did not create this account, you can safely ignore this email.
        </p>

    </div>

    <div class="footer">
        © 2026 SeekWithSight. All rights reserved.
    </div>

</div>

</body>
</html>
