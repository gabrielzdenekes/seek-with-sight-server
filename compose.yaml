services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '5432'
  redis:
    image: 'redis:8.2'
    ports:
      - '6379'

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: "en,es,de,fr,pt,zh,ja,ar,ru"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/languages"]
      interval: 20s
      timeout: 10s
      retries: 20
